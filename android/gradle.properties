# NOTE: if the daemon crashes with
#   Internal Error (assembler_aarch64.hpp:267)
#   guarantee(chk == -1 || chk == 0) failed: Field too big for insn
# that is JDK-8310844, a C1 compiler bug in OpenJDK 17.0.6-17.0.10 on Apple
# Silicon (the Gradle daemon uses Android Studio's bundled JBR by default).
# The crashed daemon can wedge while holding Gradle's cache locks, so builds
# hang forever at "Running Gradle task ..." with a fresh android/hs_err_pid*.log
# as the only evidence. The fix is a daemon JDK >= 17.0.11 (JBR 21+ is fine);
# see GitHub issue #787 for recovery steps and details.
# (-XX:ReservedCodeCacheSize=512m was removed as unneeded -- the tiered default
# is 240 MB -- but it was not the crash trigger.)
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# This is needed by permission_handler: https://pub.dev/packages/permission_handler
android.enableJetifier=true